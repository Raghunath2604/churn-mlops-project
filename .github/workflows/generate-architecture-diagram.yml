name: Generate Architecture Diagram

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Extract Mermaid from README
        run: |
          awk '/```mermaid/{flag=1; next} /```/{if(flag){exit} } flag{print}' README.md > diagram.mmd

      - name: Render PNG
        run: mmdc -i diagram.mmd -o docs/architecture.png -b transparent || mmdc -i diagram.mmd -o docs/architecture.png

      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.png || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(docs): generate architecture PNG from Mermaid"
            git push
          else
            echo "No changes to commit"
          fi
