name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./churn-model-demo

      - name: Run tests
        run: |
          python -m pytest -q
        working-directory: ./churn-model-demo

      - name: Build Docker images (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./churn-model-demo
          file: ./churn-model-demo/Dockerfile.serve
          tags: churn-service:ci
          push: false

      - name: Build Streamlit UI image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./churn-model-demo
          file: ./churn-model-demo/Dockerfile.ui
          tags: streamlit-ui:ci
          push: false

  push-images:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: ${{ secrets.GHCR_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push churn-service
        uses: docker/build-push-action@v5
        with:
          context: ./churn-model-demo
          file: ./churn-model-demo/Dockerfile.serve
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/churn-service:latest

      - name: Build and push streamlit-ui
        uses: docker/build-push-action@v5
        with:
          context: ./churn-model-demo
          file: ./churn-model-demo/Dockerfile.ui
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streamlit-ui:latest
