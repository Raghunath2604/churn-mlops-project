name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --locked --no-dev
          uv sync --locked --dev

      - name: Run tests
        run: |
          uv run python -m pytest -q

      - name: Build Docker images (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.serve
          tags: churn-service:ci
          push: false

      - name: Build Streamlit UI image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ui
          tags: streamlit-ui:ci
          push: false

  # Image publishing is intentionally left out of default CI.
  # Use scripts/build_and_push.sh or scripts/build_and_push.ps1 when GHCR is configured.
