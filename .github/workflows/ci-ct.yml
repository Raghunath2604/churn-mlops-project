name: CI-CT
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - name: Run tests
        run: uv run pytest -v
      - name: Run retention agent eval gate
        run: uv run pytest test_agent_eval.py -v
  train-and-promote:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - name: Pull latest DVC-tracked data
        run: uv run dvc pull
      - name: Train candidate and promote if it clears the gate
        run: uv run python -m churn_model.promote --config configs/train_config.yaml
