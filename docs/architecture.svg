<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <style>
    .box { fill:#ffffff; stroke:#2b6cb0; stroke-width:2; rx:6; }
    .title { font: 700 16px 'Segoe UI', Roboto, sans-serif; fill:#0b3b61; }
    .label { font: 400 13px 'Segoe UI', Roboto, sans-serif; fill:#0b3b61; }
    .infra { fill:#f7fafc; stroke:#a0aec0; stroke-width:1; }
    .arrow { stroke:#2b6cb0; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Boxes -->
  <rect x="40" y="30" width="180" height="60" class="box"/>
  <text x="130" y="60" text-anchor="middle" class="title">Customer / UI</text>

  <rect x="260" y="30" width="200" height="60" class="box"/>
  <text x="360" y="60" text-anchor="middle" class="title">Agent: Guardrail</text>

  <rect x="520" y="20" width="220" height="60" class="box"/>
  <text x="630" y="50" text-anchor="middle" class="title">Churn Risk Check</text>

  <rect x="520" y="120" width="220" height="60" class="box"/>
  <text x="630" y="150" text-anchor="middle" class="title">Routing</text>

  <rect x="780" y="20" width="160" height="60" class="box"/>
  <text x="860" y="50" text-anchor="middle" class="title">Fast LLM</text>

  <rect x="780" y="120" width="160" height="60" class="box"/>
  <text x="860" y="150" text-anchor="middle" class="title">Strong LLM / Human</text>

  <rect x="520" y="240" width="220" height="60" class="box"/>
  <text x="630" y="270" text-anchor="middle" class="title">Offer Decision</text>

  <rect x="780" y="240" width="160" height="60" class="box"/>
  <text x="860" y="270" text-anchor="middle" class="title">Escalation</text>

  <!-- Infra -->
  <rect x="40" y="320" width="900" height="70" class="infra" />
  <text x="70" y="350" class="label">Model Store (DVC + MLflow) • Serving (FastAPI / BentoML) • Observability (Prometheus)</text>

  <!-- Arrows -->
  <path d="M220 60 L260 60" class="arrow" />
  <path d="M460 60 L520 50" class="arrow" />
  <path d="M740 50 L780 50" class="arrow" />
  <path d="M740 150 L780 150" class="arrow" />
  <path d="M740 50 L650 80" class="arrow" />
  <path d="M740 150 L650 150" class="arrow" />
  <path d="M640 80 L640 120" class="arrow" />
  <path d="M640 180 L640 240" class="arrow" />
  <path d="M740 270 L780 270" class="arrow" />

  <!-- small labels -->
  <text x="400" y="40" class="label">message →</text>
  <text x="700" y="90" class="label">route →</text>

</svg>
