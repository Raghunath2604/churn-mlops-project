apiVersion: v1
kind: Namespace
metadata:
  name: mlops-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: churn-service-config
  namespace: mlops-demo
data:
  LOG_LEVEL: "INFO"
  MODEL_VERSION: "v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: churn-service-secret
  namespace: mlops-demo
type: Opaque
stringData:
  API_KEY: "demo-key-change-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-model-service
  namespace: mlops-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: churn-model-service}
  template:
    metadata:
      labels: {app: churn-model-service}
    spec:
      containers:
        - name: churn-model-service
          image: churn-model-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: churn-service-config}
            - secretRef: {name: churn-service-secret}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          volumeMounts:
            - {name: model-volume, mountPath: /app/model, readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: model-volume
          hostPath: {path: /mnt/churn-model, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: churn-model-service
  namespace: mlops-demo
spec:
  type: NodePort
  selector: {app: churn-model-service}
  ports:
    - {port: 80, targetPort: 8000, nodePort: 30080}
